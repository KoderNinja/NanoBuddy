<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NanoChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #eef0f5; --panel: #ffffff; --text: #1b1d23; --muted: #6b7080; --line: #e1e4ec;
    --nano-bubble: #f1f3f8; --you: #3157e0; --you-text: #ffffff;
    --device: #1a1d26; --device-edge: #2a2e3a; --device-text: #c9cfdd;
    --lcd: #1f46e0; --lcd-dark: #1636b8; --lcd-on: #eef4ff; --lcd-off: rgba(255, 255, 255, .07);
    --ok: #2fbf71; --warn: #f0b429; --off: #e5484d;
    --pixel: "VT323", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1116; --panel: #161921; --text: #e8eaf0; --muted: #8b90a0; --line: #252a35;
      --nano-bubble: #1f2330; --you: #4a6cf0; --device: #0b0d12; --device-edge: #222632;
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--text);
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif;
  }
  .app { height: 100%; display: grid; grid-template-columns: 360px 1fr; max-width: 1100px; margin: 0 auto; }

  /* ---------- the "device": big face + virtual LCD ---------- */
  .device {
    background: var(--device); color: var(--device-text);
    display: flex; flex-direction: column; align-items: center; gap: 22px;
    padding: 28px 22px; border-right: 1px solid var(--device-edge);
  }
  .brand { align-self: stretch; display: flex; align-items: center; justify-content: space-between; }
  .brand h1 { margin: 0; font: 400 30px/1 var(--pixel); letter-spacing: 1px; color: #fff; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 13px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--off); box-shadow: 0 0 8px currentColor; color: var(--off); }
  .dot.online { background: var(--ok); color: var(--ok); }
  .dot.connecting { background: var(--warn); color: var(--warn); }

  .face-wrap {
    width: 190px; height: 230px; border-radius: 28px; display: grid; place-items: center;
    background: radial-gradient(circle at 50% 40%, var(--lcd) 0%, var(--lcd-dark) 100%);
    box-shadow: inset 0 0 0 6px rgba(0, 0, 0, .25), 0 18px 40px rgba(31, 70, 224, .35);
    transition: transform .25s ease;
  }
  .face-wrap.bump { transform: scale(1.05) rotate(-2deg); }
  .face-wrap.thinking { animation: bob 1s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(-6px); } }
  #bigFace { width: 120px; height: 192px; }
  .mood { font: 400 22px/1 var(--pixel); color: #fff; opacity: .85; margin-top: -10px; letter-spacing: 1px; }

  .lcd {
    background: var(--lcd); border-radius: 10px; padding: 12px 12px 10px;
    box-shadow: inset 0 0 0 4px rgba(0, 0, 0, .3), 0 0 0 6px #0e3b25, 0 0 0 7px #1e5c3c;
  }
  .lcd-row { display: grid; grid-template-columns: repeat(16, 17px); gap: 2px; }
  .lcd-row + .lcd-row { margin-top: 3px; }
  .cell {
    height: 26px; background: var(--lcd-off); border-radius: 2px;
    font: 400 26px/26px var(--pixel); color: var(--lcd-on); text-align: center;
    text-shadow: 0 0 6px rgba(255, 255, 255, .55);
  }
  .cell svg { width: 100%; height: 100%; display: block; }
  .lcd-label { font-size: 12px; color: #7d8496; margin-top: -12px; }

  .net { align-self: stretch; }
  .net-title { font-size: 12px; color: #7d8496; margin-bottom: 8px; }
  .helpers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .helper {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; border-radius: 10px;
    background: #12151d; border: 1px solid var(--device-edge); font-size: 13px; color: #6b7183;
    transition: border-color .3s, color .3s;
  }
  .helper .led { width: 8px; height: 8px; border-radius: 50%; background: #333846; flex: none; transition: background .3s; }
  .helper.on { color: var(--device-text); }
  .helper.on .led { background: var(--ok); box-shadow: 0 0 6px var(--ok); }
  .helper.busy { border-color: var(--lcd); }
  .helper.busy .led { background: #8fb0ff; box-shadow: 0 0 10px #8fb0ff; }
  .helper small { margin-left: auto; font-size: 11px; color: #5c6273; }
  .via { display: flex; gap: 4px; margin-top: 4px; }
  .via span {
    font-size: 11px; padding: 1px 7px; border-radius: 999px;
    background: var(--nano-bubble); color: var(--muted); border: 1px solid var(--line);
  }
  .phone { align-self: stretch; text-align: center; font-size: 12px; color: #7d8496; }
  .phone #qr { display: inline-block; background: #fff; padding: 8px; border-radius: 10px; margin: 6px 0 4px; }
  .phone #qr img, .phone #qr canvas { display: block; width: 112px; height: 112px; }
  .phone a { color: #a9b8ff; word-break: break-all; }
  .quit {
    margin-top: auto; border: 1px solid var(--device-edge); background: transparent; color: var(--device-text);
    border-radius: 10px; padding: 7px 14px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .quit:hover { border-color: #444a5a; }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
  #log { flex: 1; overflow-y: auto; padding: 22px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: flex-end; max-width: 85%; animation: pop .18s ease-out; }
  @keyframes pop { from { opacity: 0; transform: translateY(6px); } }
  .row.you { align-self: flex-end; }
  .avatar {
    flex: none; width: 30px; height: 36px; border-radius: 9px; padding: 4px 6px;
    background: var(--lcd); box-shadow: inset 0 0 0 2px rgba(0, 0, 0, .25);
  }
  .avatar svg { width: 100%; height: 100%; display: block; }
  .bubble { padding: 9px 14px; border-radius: 18px; white-space: pre-wrap; word-wrap: break-word; }
  .nano .bubble { background: var(--nano-bubble); border-bottom-left-radius: 5px; }
  .you .bubble { background: var(--you); color: var(--you-text); border-bottom-right-radius: 5px; }
  .note { align-self: center; color: var(--muted); font-size: 13px; }
  .typing span { display: inline-block; animation: hop 1s infinite; }
  .typing span:nth-child(2) { animation-delay: .15s; }
  .typing span:nth-child(3) { animation-delay: .3s; }
  @keyframes hop { 30% { transform: translateY(-4px); opacity: 1; } 0%, 60%, 100% { opacity: .35; } }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 22px 12px; }
  .chips button {
    border: 1px solid var(--line); background: var(--bg); color: var(--text);
    border-radius: 999px; padding: 6px 12px; font: inherit; font-size: 13px; cursor: pointer;
  }
  .chips button:hover { border-color: var(--you); }
  form { display: flex; gap: 8px; padding: 14px 22px 20px; border-top: 1px solid var(--line); }
  input {
    flex: 1; min-width: 0; font: inherit; color: var(--text); background: var(--bg);
    border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px; outline: none;
  }
  input:focus { border-color: var(--you); }
  form button {
    font: inherit; font-weight: 600; border: 0; border-radius: 14px; padding: 0 18px;
    background: var(--you); color: var(--you-text); cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: default; }

  @media (max-width: 760px) {
    .app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
    .device { flex-direction: row; flex-wrap: wrap; justify-content: center; padding: 14px 16px; gap: 14px; }
    .brand { flex-basis: 100%; }
    .face-wrap { width: 92px; height: 112px; border-radius: 18px; }
    #bigFace { width: 56px; height: 90px; }
    .mood, .lcd-label, .quit { display: none; }
    .lcd-row { grid-template-columns: repeat(16, 12px); }
    .cell { height: 20px; font-size: 19px; line-height: 20px; }
    #log { padding: 16px; }
    .chips { padding: 0 16px 10px; }
    form { padding: 12px 16px 16px; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="device">
    <div class="brand">
      <h1>NanoChat</h1>
      <div class="status"><span class="dot" id="dot"></span><span id="status">Looking…</span></div>
    </div>
    <div class="face-wrap" id="faceWrap"><svg id="bigFace" viewBox="0 0 5 8"></svg></div>
    <div class="mood" id="mood">hello!</div>
    <div class="lcd" aria-label="NanoChat screen">
      <div class="lcd-row" id="lcd0"></div>
      <div class="lcd-row" id="lcd1"></div>
    </div>
    <div class="lcd-label">same as the screen on your Nano</div>
    <div class="net">
      <div class="net-title">NanoNet helpers</div>
      <div class="helpers" id="helpers"></div>
    </div>
    <div class="phone" id="phone" hidden>
      Chat from your phone (same Wi-Fi):
      <div id="qr"></div>
      <div><a id="phoneUrl"></a></div>
    </div>
    <button class="quit" id="quit" title="Stop NanoChat">Quit NanoChat</button>
  </aside>

  <main class="chat">
    <div id="log" aria-live="polite"></div>
    <div class="chips" id="chips"></div>
    <form id="form">
      <input id="input" maxlength="80" autocomplete="off" placeholder="Say something to NanoChat…" autofocus>
      <button id="send">Send</button>
    </form>
  </main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script>
  // The same 5x8 faces the Nano draws on its LCD (one byte per row, 5 bits wide).
  const FACES = [
    [0x00, 0x0A, 0x0A, 0x00, 0x11, 0x0E, 0x00, 0x00],  // 0 happy
    [0x00, 0x0A, 0x0A, 0x00, 0x0E, 0x11, 0x00, 0x00],  // 1 sad
    [0x00, 0x0A, 0x0A, 0x00, 0x0E, 0x0A, 0x0E, 0x00],  // 2 wow / thinking
  ];
  const BLINK = { 0: [0x00, 0x00, 0x0A, 0x00, 0x11, 0x0E, 0x00, 0x00] };  // eyes shut
  const MOODS = ["happy!", "aww…", "whoa!"];

  function faceSVG(rows) {
    let s = "";
    rows.forEach((bits, y) => {
      for (let x = 0; x < 5; x++) {
        const on = bits >> (4 - x) & 1;
        s += `<rect x="${x + .06}" y="${y + .06}" width=".88" height=".88" rx=".12" fill="${on ? "#eef4ff" : "rgba(255,255,255,.07)"}"/>`;
      }
    });
    return s;
  }
  const svg = rows => `<svg viewBox="0 0 5 8">${faceSVG(rows)}</svg>`;

  // ---------- big face ----------
  const bigFace = document.getElementById("bigFace");
  const faceWrap = document.getElementById("faceWrap");
  let mood = 0;
  function showFace(m, label) {
    mood = m;
    bigFace.innerHTML = faceSVG(FACES[m]);
    document.getElementById("mood").textContent = label || MOODS[m];
    faceWrap.classList.remove("bump");
    void faceWrap.offsetWidth;
    faceWrap.classList.add("bump");
    setTimeout(() => faceWrap.classList.remove("bump"), 250);
  }
  setInterval(() => {  // blink now and then when happy
    if (mood !== 0 || faceWrap.classList.contains("thinking")) return;
    bigFace.innerHTML = faceSVG(BLINK[0]);
    setTimeout(() => { if (mood === 0) bigFace.innerHTML = faceSVG(FACES[0]); }, 140);
  }, 3500);

  // ---------- virtual 16x2 LCD (wraps and pages like the Nano) ----------
  const rows = [document.getElementById("lcd0"), document.getElementById("lcd1")];
  rows.forEach(r => { for (let i = 0; i < 16; i++) r.appendChild(Object.assign(document.createElement("div"), { className: "cell" })); });
  let lcdText = "", lcdFace = 0, lcdPos = 0, lcdTimer = null;

  function lcdLine(text, pos) {  // same word wrap as screenRow() on the Nano
    while (pos < text.length && text[pos] === " ") pos++;
    let end = Math.min(pos + 16, text.length);
    if (end < text.length && text[end] !== " ") {
      const sp = text.lastIndexOf(" ", end);
      if (sp > pos) end = sp;
    }
    return [text.slice(pos, end), end];
  }
  function drawRow(r, chars, faceIdx) {
    [...rows[r].children].forEach((cell, i) => {
      if (faceIdx !== undefined && i === 0) cell.innerHTML = svg(FACES[faceIdx]);
      else cell.textContent = chars[i] || "";
    });
  }
  function lcdPage() {
    const full = "\u0000 " + lcdText;  // slot 0 is the face, like the real screen
    const [a, p1] = lcdLine(full, lcdPos);
    const [b, p2] = lcdLine(full, p1);
    drawRow(0, a, lcdPos === 0 && a.startsWith("\u0000") ? lcdFace : undefined);
    drawRow(1, b);
    lcdPos = p2 >= full.length ? 0 : p2;
    return p2 < full.length || lcdPos !== 0;
  }
  function lcdShow(text, faceIdx) {
    lcdText = text; lcdFace = faceIdx; lcdPos = 0;
    clearInterval(lcdTimer);
    if (lcdPage()) lcdTimer = setInterval(lcdPage, 2500);
  }
  function lcdRaw(a, b) {
    clearInterval(lcdTimer);
    drawRow(0, a); drawRow(1, b);
  }

  // ---------- NanoNet helpers: lit = plugged in, flashing = just answered ----------
  const HELPERS = [["Brain", "understands you"], ["Words", "words, trivia"], ["Calc", "math, units"], ["Library", "facts, tips"]];
  const helperEls = HELPERS.map(([name, job]) => {
    const el = document.createElement("div");
    el.className = "helper";
    el.title = job;
    el.innerHTML = `<span class="led"></span>${name}<small>${job.split(",")[0]}</small>`;
    document.getElementById("helpers").appendChild(el);
    return el;
  });
  let pendingHelpers = [];
  function helperAnswered(i) {
    const el = helperEls[i];
    if (!el) return;
    el.classList.add("on", "busy");
    setTimeout(() => el.classList.remove("busy"), 900);
    if (!pendingHelpers.includes(i)) pendingHelpers.push(i);
  }

  // ---------- chat ----------
  const log = document.getElementById("log");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  const STATUS = {
    searching: "Plug in your Nano",
    connecting: "Connecting…",
    online: "Online",
    stopped: "App stopped",
  };
  const IDEAS = ["tell me a joke", "trivia", "roll 3 dice", "again", "5 miles to km",
                 "guess my number", "set a timer for 1 minute", "start stopwatch",
                 "morse sos", "what's the weather", "who is Ada Lovelace", "help"];
  let online = false, typing = null, lastNano = null;

  function addRow(who, text) {
    const row = document.createElement("div");
    row.className = "row " + who;
    if (who === "nano") row.innerHTML = `<div class="avatar">${svg(FACES[0])}</div>`;
    const b = document.createElement("div");
    b.className = "bubble";
    b.textContent = text;
    row.appendChild(b);
    log.appendChild(row);
    log.scrollTop = log.scrollHeight;
    return row;
  }
  function note(text) {
    const n = Object.assign(document.createElement("div"), { className: "note", textContent: text });
    log.appendChild(n);
    log.scrollTop = log.scrollHeight;
  }
  function stopTyping() {
    if (typing) { typing.remove(); typing = null; }
    faceWrap.classList.remove("thinking");
  }

  function setStatus(s) {
    online = s === "online";
    document.getElementById("dot").className = "dot " + s;
    document.getElementById("status").textContent = STATUS[s] || s;
    send.disabled = !online;
    if (online) {
      if (!log.children.length) note("Connected. Say hi!");
      showFace(0, "hello!");
      lcdShow("NanoChat ready. Say hi!", 0);
    } else {
      lcdRaw(s === "connecting" ? "Connecting..." : "Waiting for", s === "connecting" ? "" : "the Nano...");
    }
  }

  async function say(text) {
    text = text.trim();
    if (!text || !online) return;
    addRow("you", text);
    input.value = "";
    const r = await fetch("/send", { method: "POST", body: text });
    if (!r.ok) note("Couldn't reach the Nano. Is it plugged in?");
  }

  document.getElementById("form").addEventListener("submit", e => { e.preventDefault(); say(input.value); });
  for (const idea of IDEAS) {
    const b = Object.assign(document.createElement("button"), { type: "button", textContent: idea });
    b.onclick = () => say(idea);
    document.getElementById("chips").appendChild(b);
  }
  document.getElementById("quit").onclick = async () => {
    await fetch("/quit", { method: "POST" }).catch(() => {});
    document.body.innerHTML = "<p style='margin:40vh auto;text-align:center;color:gray'>NanoChat stopped. You can close this tab.</p>";
  };

  const events = new EventSource("/events");
  events.onmessage = e => {
    const ev = JSON.parse(e.data);
    if (ev.kind === "status") setStatus(ev.text);
    else if (ev.kind === "thinking") {
      stopTyping();
      typing = addRow("nano", "");
      typing.querySelector(".avatar").innerHTML = svg(FACES[2]);
      typing.querySelector(".bubble").innerHTML = '<span class="typing">Looking it up <span>.</span><span>.</span><span>.</span></span>';
      showFace(2, "thinking…");
      faceWrap.classList.add("thinking");
      lcdRaw("Asking the", "internet...");
    } else if (ev.kind === "network") {
      [...ev.text].forEach((c, i) => helperEls[i] && helperEls[i].classList.toggle("on", c === "1"));
    } else if (ev.kind === "helper") {
      helperAnswered(+ev.text);
    } else if (ev.kind === "nano") {
      stopTyping();
      lastNano = addRow("nano", ev.text);
      if (pendingHelpers.length) {  // tag the reply with the helpers that worked on it
        const via = document.createElement("div");
        via.className = "via";
        via.innerHTML = pendingHelpers.map(i => `<span>via ${HELPERS[i][0]}</span>`).join("");
        lastNano.querySelector(".bubble").appendChild(via);
        pendingHelpers = [];
      }
      lcdShow(ev.text, 0);
    } else if (ev.kind === "face") {
      const f = Math.min(+ev.text, FACES.length - 1);
      if (lastNano) lastNano.querySelector(".avatar").innerHTML = svg(FACES[f]);
      showFace(f);
      lcdFace = f;
      if (lcdPos !== 0 || lcdText) { lcdPos = 0; lcdPage(); }
    }
  };
  events.onerror = () => setStatus("stopped");

  showFace(0, "hello!");
  lcdRaw("Waiting for", "the Nano...");

  // On the Mac, show a QR code a phone can scan to open this same page.
  if (["127.0.0.1", "localhost"].includes(location.hostname)) {
    fetch("/phone").then(r => r.text()).then(url => {
      if (!url) return;
      document.getElementById("phone").hidden = false;
      const a = document.getElementById("phoneUrl");
      a.textContent = url;
      a.href = url;
      if (window.QRCode) new QRCode(document.getElementById("qr"), { text: url, width: 112, height: 112 });
    });
  } else {
    document.getElementById("quit").hidden = true;  // only the Mac can stop the app
  }
</script>
</body>
</html>
